      }

      .image-link:active {
        transform: scale(0.98);
        filter: brightness(0.96);
      }

      .image-link:focus-visible {

        outline-offset: 6px;
        border-radius: 18px;

        width: auto;
        height: auto;
        display: block;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        user-select: none;
        -webkit-user-drag: none;
      }
