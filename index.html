    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg-color: #0d1117;
      }

      @media (prefers-color-scheme: light) {
        :root {
          --bg-color: #f3f4f6;
        }
      }

      body {
        background-color: var(--bg-color);
        min-height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 20px;
        overflow: hidden;
      }

      .image-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        outline: none;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), filter 0.25s ease;
      }

      .image-link:hover {
        transform: scale(1.02);
        filter: brightness(1.04);
      }

      .image-link:active {
        transform: scale(0.98);
        filter: brightness(0.96);
      }

      .image-link:focus-visible {
        outline: 3px solid #24A1DE;
        outline-offset: 6px;
        border-radius: 18px;
      }

      .picture {
        max-width: min(90vw, 600px);
        max-height: 90vh;
        width: auto;
        height: auto;
        display: block;
        object-fit: contain;
        border-radius: 16px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
